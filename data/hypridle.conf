# Grace Candyland idle rules (hypridle). Lock after 10 minutes, screen off after 15, and lock before sleep.
general {
    lock_cmd = qs -p @SHELLDIR@ ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
