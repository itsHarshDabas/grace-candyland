# Grace Candyland: hypridle only handles sleep and `loginctl lock-session`. The idle timeouts
# (lock, screen off, suspend) live in the shell and are set in Settings (services/Idle.qml).
general {
    lock_cmd = qs -p @SHELLDIR@ ipc call lock lock
    before_sleep_cmd = qs -p @SHELLDIR@ ipc call lock beforeSleep
    after_sleep_cmd = hyprctl dispatch dpms on
}
