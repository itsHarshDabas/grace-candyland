# Grace Candyland desktop settings.
# Settings > Appearance edits this file, and so can you: changes apply live.

style = dark            # dark | light (the color scheme apps are asked to use)
accent = blue           # blue teal green yellow orange red pink purple slate
gaps = 10               # 0-24 px, even numbers: screen edges and between windows
rounding = 12           # 0-22 px window corners
blur = on               # on | off
layout = tile           # tile | float
animations = smooth     # off | calm | smooth | snappy (off while the system asks for reduced motion)
dock = hover            # hover (bottom-edge) | always | never
ai = on                 # master switch for every AI touch
dnd = off               # Do Not Disturb: notifications skip the banner
night_light = off       # needs hyprsunset

# Dock apps, by desktop entry id (the .desktop file name without .desktop).
pinned = org.gnome.Nautilus thunar org.graceos.CandySole org.graceos.CottonCandy twirl

# Optional:
# terminal = kitty      # used by Super+Return; otherwise CandySole, or the first installed of konsole, kitty, ...
# wallpaper = /path/to/picture.jpg
# cortex_council = ~/Cortex-Council  # a Cortex Council checkout, if the cortex-council command isn't installed
# ask_command = cherrycola ask  # the default; gets the "Ask Grace" question as its last argument, prints the answer
