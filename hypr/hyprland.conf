# Grace Candyland: Hyprland defaults.
# Don't edit this file. Put your own Hyprland settings in ~/.config/grace/hyprland.conf
# (loaded last, so it wins), and desktop options in ~/.config/grace/desktop.conf.
# Gaps, rounding, blur, animations and layout below are startup values; the shell
# re-applies them from desktop.conf.

$shell = @SHELLDIR@

monitor = , preferred, auto, auto

env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, gtk3
env = GDK_BACKEND, wayland,x11
env = MOZ_ENABLE_WAYLAND, 1

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    # Hairline edges, never colored outlines.
    col.active_border = rgba(ffffff24)
    col.inactive_border = rgba(ffffff12)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    rounding_power = 2.6
    shadow {
        enabled = true
        range = 28
        render_power = 3
        offset = 0 10
        color = rgba(00000070)
    }
    blur {
        enabled = true
        size = 7
        passes = 3
        vibrancy = 0.17
        popups = true
    }
}

animations {
    enabled = true
    bezier = grace, 0.2, 0.9, 0.25, 1
    bezier = graceOut, 0.4, 0, 0.6, 1
    animation = windows, 1, 4.5, grace, popin 90%
    animation = fade, 1, 3, graceOut
    animation = workspaces, 1, 4, grace, slidefade 12%
    animation = layers, 1, 3, grace, fade
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(121419)
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# Frosted glass behind the shell's own surfaces; transparent pixels stay unblurred.
layerrule = blur on, match:namespace grace-(bar|panel|popup|launcher|dock)
layerrule = ignore_alpha 0.4, match:namespace grace-(bar|panel|popup|launcher|dock)

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = qs -p $shell
# Virtual machines often draw the hardware cursor in the wrong place.
exec-once = systemd-detect-virt -q && hyprctl keyword cursor:no_hardware_cursors true

# Keys. Super+Space is "Ask Grace" (app search and AI), like Spotlight.
bind = SUPER, SPACE, global, quickshell:launcher
bind = SUPER, N, global, quickshell:controlcenter
bind = SUPER, I, exec, grace-settings
bind = SUPER, RETURN, exec, grace-launch terminal
bind = SUPER, T, exec, grace-launch terminal
bind = SUPER, E, exec, grace-launch files
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen, 0
bind = SUPER, M, fullscreen, 1
bind = SUPER, V, togglefloating
bind = SUPER, J, layoutmsg, togglesplit
bind = SUPER SHIFT, Q, exit

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bind = , Print, exec, grace-launch screenshot
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%-

source = ~/.config/grace/hyprland.conf
